name: Backtest

# Rebuilds trader positions from fills and tests the score. Takes 1-2 hours.
# Writes backtest.json to the "backtest" branch. Runs every Sunday, or by hand.
on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to test"
        default: "40"
      max_minutes:
        description: "Time budget for loading trader fills (minutes)"
        default: "110"
      panel:
        description: "Also save the hourly research panel (panel.json.gz)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get the current market list
        run: |
          mkdir -p bt
          git fetch --depth=1 origin data && git show origin/data:latest.json > bt/latest.json || true
      - name: Run the backtest
        env:
          BT_DAYS: ${{ inputs.days || '40' }}
          BT_MAX_MIN: ${{ inputs.max_minutes || '110' }}
          BT_PANEL: ${{ inputs.panel || '1' }}
        run: node scripts/backtest.mjs bt bt/latest.json
      - name: Push results to the backtest branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd bt && rm -f latest.json
          git init -q -b backtest
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "backtest $(date -u +%FT%TZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" backtest

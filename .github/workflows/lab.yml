name: Bet lab

# Hypothetical bets on every liquid market + a profile of each market (industry, life cycle, own past, peers).
# Writes lab.json to the "lab" branch. Runs every day, when the lab script changes, or by hand.
on:
  schedule:
    - cron: "41 12 * * *"
  push:
    branches: [main]
    paths: ["scripts/lab.mjs", ".github/workflows/lab.yml", "tax.js"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lab
  cancel-in-progress: true

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get the current market list
        run: |
          mkdir -p lab
          git fetch --depth=1 origin data && git show origin/data:latest.json > latest.json
          git fetch --depth=1 origin lab && git show origin/lab:lab.json > lab_prev.json || true
      - name: Run the bet lab
        run: node scripts/lab.mjs lab latest.json
      - name: Push results to the lab branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd lab
          git init -q -b lab
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "lab $(date -u +%FT%TZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lab
      # Council, Nov 12 2026 (Cohort agent request): the watchdog's own schedule started only 3 of ~48 runs in 24 h, so this job
      # (which runs anyway) does the same data-age check as its last step. GitHub API only, no Hyperliquid call.
      - name: Data watchdog (restart the data relay when it stopped)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          t=$(gh api "repos/${GITHUB_REPOSITORY}/branches/data" --jq '.commit.commit.committer.date' || echo "")
          [ -z "$t" ] && { echo "no data branch date"; exit 0; }
          age=$(( $(date -u +%s) - $(date -u -d "$t" +%s) ))
          busy=$(gh run list -w update.yml -L 10 -R "${GITHUB_REPOSITORY}" --json status -q '[.[] | select(.status != "completed")] | length' || echo 1)
          echo "data branch at $t (age $((age / 60)) min), update.yml runs not done: $busy"
          if [ $age -gt 3600 ] && [ "$busy" = "0" ]; then
            gh workflow run update.yml --ref main -R "${GITHUB_REPOSITORY}" && echo "data relay restarted" || echo "could not start update.yml"
          else echo "relay OK, nothing to do"; fi

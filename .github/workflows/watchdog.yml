name: Data watchdog

# Council, Nov 11 2026 (Cohort agent request): the data job (update.yml) keeps itself on with a relay (each run starts the
# next). On Nov 11 one "startup_failure" at 20:23 UTC stopped the relay, and update.yml's own */20 schedule did not start a
# run for about 2 hours, so the data branch was 2 h old. This job runs on its own schedule. It starts update.yml only when
# the data branch is older than 60 minutes AND no update.yml run is running or waiting. It reads only GitHub (no Hyperliquid
# call), so it costs nothing when the relay is healthy.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart the data relay when it stopped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          t=$(gh api "repos/${GITHUB_REPOSITORY}/branches/data" --jq '.commit.commit.committer.date' || echo "")
          [ -z "$t" ] && { echo "no data branch date"; exit 0; }
          age=$(( $(date -u +%s) - $(date -u -d "$t" +%s) ))
          busy=$(gh run list -w update.yml -L 10 -R "${GITHUB_REPOSITORY}" --json status -q '[.[] | select(.status != "completed")] | length' || echo 1)
          echo "data branch at $t (age $((age / 60)) min), update.yml runs not done: $busy"
          if [ $age -gt 3600 ] && [ "$busy" = "0" ]; then
            gh workflow run update.yml --ref main -R "${GITHUB_REPOSITORY}" && echo "data relay restarted" || echo "could not start update.yml"
          else echo "relay OK, nothing to do"; fi
